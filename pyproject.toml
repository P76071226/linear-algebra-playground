[project]
name = "linalg-playground"
version = "0.1.0"
description = "Small visual projects for building linear algebra intuition: transforms, PCA, least squares, ICP, and Kalman filtering."
authors = [{ name = "Kai Yao" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.1",
    "scikit-learn>=1.4",
    "jupyter>=1.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linalg_playground"]
